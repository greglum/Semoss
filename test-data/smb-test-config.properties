# SMB Test Configuration
# Use this with the docker-compose.smb-test.yml Docker container

# Docker Samba container settings
SMB_HOST=localhost
SMB_PORT=445
SMB_USER=testuser
SMB_PASS=testpass
SMB_DOMAIN=WORKGROUP
SMB_SHARE_NAME=testshare
SMB_TIMEOUT=60

# Alternative: Windows localhost share (if you have SMB enabled on Windows)
# SMB_HOST=127.0.0.1
# SMB_PORT=445
# SMB_USER=YourWindowsUsername
# SMB_PASS=YourWindowsPassword
# SMB_DOMAIN=
# SMB_SHARE_NAME=C$
# SMB_TIMEOUT=60

# Note: On Windows, you may need to enable SMB in Windows Features
# and create a shared folder for testing
